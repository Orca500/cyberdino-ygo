<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <title>Century Format Cards</title>
    <link rel="stylesheet" href="styles.css?v=errata-text-badge-respaced-20260701">
    <style id="ready-decks-v6-inline-fix">
        #decksButton #decksText.bannerButtonText .decksReadyLine,
        #decksButton #decksText.bannerButtonText .decksDecksLine {
            display: block !important;
            white-space: nowrap !important;
            word-break: keep-all !important;
            overflow-wrap: normal !important;
            hyphens: none !important;
            font-size: 24px !important;
            line-height: 1 !important;
            letter-spacing: -0.045em !important;
            max-width: 196px !important;
        }

        #decksButton #decksText.bannerButtonText {
            padding: 4px !important;
            overflow: hidden !important;
        }

        #decksButton #decksText.bannerButtonText .decksLabelStack {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
        }

        #decksButton #decksText.bannerButtonText .decksDecksLine {
            margin-top: 6px !important;
        }
    </style>

    <style id="century-cinzel-v2-inline-fix">
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        .site-banner > h1#siteTitle.centuryBannerTitle {
            position: relative !important;
            z-index: 1 !important;
            margin: 0 !important;
            font-family: 'Cinzel', Georgia, 'Times New Roman', serif !important;
            font-size: 46px !important;
            line-height: 1.05 !important;
            font-weight: 700 !important;
            letter-spacing: 0.03em !important;
            color: #fff !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 18px rgba(126,200,255,0.35) !important;
        }
    </style>
    <!-- century-cinzel-v2-marker -->
    <link rel="icon" type="image/jpeg" sizes="60x60" href="images/icon.png">
    
</head>
<body>

<header class="site-banner">
    <h1 id="siteTitle" class="centuryBannerTitle">Century Yu-Gi-Oh!</h1>

    <div id="rulesButton" class="bannerButton">
        <img src="images/rules.jpg" alt="How to Play">
        <div id="rulesText" class="bannerButtonText">How to Play</div>
    </div>

    <div id="decksButton" class="bannerButton">
        <img src="images/decks.jpg" alt="Ready-to-Play Decks">
        <div id="decksText" class="bannerButtonText">
            <span class="decksLabelStack">
                <span class="decksReadyLine">Ready&#8209;to&#8209;Play</span>
                <span class="decksDecksLine">Decks</span>
            </span>
        </div>
    </div>
</header>

<section id="filters">

    <input type="text" id="search" placeholder="Search card name...">

    <input type="text" id="searchDesc" placeholder="Search card text...">

    <select id="cardCategory">
        <option value="">All Categories</option>
        <option>Monster</option>
        <option>Spell</option>
        <option>Trap</option>
    </select>

    <select id="monsterType">
        <option value="">All Monster Types</option>
    </select>

    <select id="monsterClass">
        <option value="">All Monster Classes</option>
    </select>

    <select id="attribute">
        <option value="">All Attributes</option>
    </select>

    <select id="archetype">
        <option value="">All Archetypes</option>
    </select>

    <div>
        <label>Points</label>
        <select id="pointsOp">
            <option value="<="><=</option>
            <option value=">=">>=</option>
            <option value="=">=</option>
        </select>
        <input type="number" id="pointsFilter">
    </div>

    <div>
        <label>Level</label>
        <select id="levelOp">
            <option value="<="><=</option>
            <option value=">=">>=</option>
            <option value="=">=</option>
        </select>
        <input type="number" id="levelFilter">
    </div>

    <div>
        <label>ATK</label>
        <select id="atkOp">
            <option value="<="><=</option>
            <option value=">=">>=</option>
            <option value="=">=</option>
        </select>
        <input type="number" id="atkFilter">
    </div>

    <div>
        <label>DEF</label>
        <select id="defOp">
            <option value="<="><=</option>
            <option value=">=">>=</option>
            <option value="=">=</option>
        </select>
        <input type="number" id="defFilter">
    </div>

    <select id="sort">
        <option value="nameAsc">Name A-Z</option>
        <option value="nameDesc">Name Z-A</option>
        <option value="pointsDesc">Points High-Low</option>
        <option value="pointsAsc">Points Low-High</option>
        <option value="levelDesc">Level High-Low</option>
        <option value="levelAsc">Level Low-High</option>
        <option value="atkDesc">ATK High-Low</option>
        <option value="atkAsc">ATK Low-High</option>
        <option value="defDesc">DEF High-Low</option>
        <option value="defAsc">DEF Low-High</option>
    </select>

</section>

<section id="stats"></section>
<section id="cardGrid"></section>
